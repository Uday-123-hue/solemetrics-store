{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
  <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
    <h1 class="font-extrabold text-lg text-slate-900">Complete Your Purchase</h1>
    <a href="{{ url_for('shop') }}" class="text-xs font-bold text-slate-500 hover:text-slate-900">&larr; Back to Shop</a>
  </div>

  <form method="POST" action="{{ url_for('place_order') }}" class="p-6 space-y-5">
    <input type="hidden" name="product_id" value="{{ product.id }}" />

    <div class="flex gap-4 items-center bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
      <img src="{{ product.image }}" alt="{{ product.name }}" class="w-20 h-20 rounded-xl object-cover bg-white border border-slate-200" />
      <div>
        <span class="text-[11px] font-bold uppercase text-indigo-600">{{ product.brand }}</span>
        <h2 class="font-extrabold text-slate-900 text-base">{{ product.name }}</h2>
        <p class="text-xs text-slate-500">{{ product.category }}</p>
        <p class="font-extrabold text-slate-900 text-sm mt-1">{{ product.price | inr }} / pair</p>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Select UK Size</label>
        <select name="size" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold bg-white">
          <option value="UK 6">UK 6</option>
          <option value="UK 7">UK 7</option>
          <option value="UK 8" selected>UK 8</option>
          <option value="UK 9">UK 9</option>
          <option value="UK 10">UK 10</option>
          <option value="UK 11">UK 11</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Quantity</label>
        <input type="number" name="qty" min="1" max="10" value="1" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Delivery City</label>
        <input type="text" name="city" value="{{ current_user.city }}" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Payment Mode</label>
        <select name="payment_method" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold bg-white">
          <option value="UPI">UPI Instant</option>
          <option value="Credit/Debit Card">Credit / Debit Card</option>
          <option value="Cash on Delivery">Cash on Delivery</option>
        </select>
      </div>
    </div>

    <button type="submit" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-extrabold text-sm hover:bg-emerald-600 transition">
      Confirm Order &amp; Generate Receipt &rarr;
    </button>
  </form>
</div>
{% endblock %}
